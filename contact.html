<h1>Contact</h1><p>[A line or two about how and why to get in touch.]</p>
<h2>Send a message</h2>
<!-- TODO: replace YOUR_ACCESS_KEY_HERE with the access key Web3Forms emails you -->
<form action="https://api.web3forms.com/submit" method="post">
<input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
<input type="hidden" name="subject" value="New message from the CFM website">
<input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
<div class="field"><label for="c-name">Your name</label><input id="c-name" type="text" name="name" autocomplete="name" required></div>
<div class="field"><label for="c-email">Your email address</label><input id="c-email" type="email" name="email" autocomplete="email" required></div>
<div class="field"><label for="c-message">Your message</label><textarea id="c-message" name="message" rows="6" required></textarea></div>
<button type="submit">Send message</button>
</form>
<h2>Prefer email?</h2><p><a href="mailto:YOUR-EMAIL@example.com">Email me directly</a></p>
